server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. Junto con la variable $api_upstream de abajo, nginx vuelve a resolver el nombre `api`
    # en cada request (cada 10 s): arranca aunque la API todavía no exista y sobrevive a que la API se reinicie
    # con otra IP. Sin esto, resolvería `api` una sola vez al arrancar y quedaría apuntando a una IP vieja.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # El navegador solo habla con este origen: /api/* se reenvía a la API sin el prefijo /api. No hace falta CORS.
    location /api/ {
        set $api_upstream http://api:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Healthcheck del propio contenedor (no depende de la API).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Archivos con hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El index.html nunca se cachea: así un despliegue nuevo se ve de inmediato.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
